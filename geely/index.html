<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geely E2 Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Geely E2 Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000"><meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: same single phone column as Meter Log. New entry first, then cycles used, then the day-by-day log. */
:root {
  /* One look only: red on black, in light and dark mode alike. */
  --bg: #000000;
  --surface: #0d0707;
  --surface-2: #170d0d;
  --ink: #f4ecec;
  --ink-soft: #a99696;
  --line: #301b1b;
  --accent: #e53935;
  --accent-ink: #ffffff;
  --lcd-bg: #000000;
  --lcd-fg: #ff5a52;
  --warn: #ffb347;
  --weekend: #ff5a52;
  --font-body: "Instrument Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-num: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; font-weight: 600; margin: 0; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.status { font-size: 12px; color: var(--ink-soft); text-align: right; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

/* cycles */
.hero { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hero .big { font-family: var(--font-num); font-size: 52px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.hero .cap { font-size: 15px; color: var(--ink-soft); }
.bar { height: 12px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.barlabel { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--font-num); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--ink-soft); }
.warn { border: 1px solid var(--warn); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink); }
.warn strong { color: var(--warn); }
.warn span { color: var(--ink-soft); }
.warn ul { margin: 0; padding-left: 18px; font-family: var(--font-num); font-size: 13px; }
.hint { font-size: 14px; color: var(--ink-soft); margin: 0; }

/* controls */
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-soft); min-width: 0; }
label.f > .lbl { display: flex; align-items: baseline; gap: 6px; min-height: 20px; white-space: nowrap; overflow: hidden; }
input[type=date], input[type=time], input[type=text] {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 11px 12px; min-height: 46px; width: 100%; min-width: 0;
}
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; align-items: end; }
input[type=date], input[type=time] { height: 48px; line-height: 24px; margin: 0; -webkit-appearance: none; appearance: none; display: block; max-width: 100%; text-align: left; }
input[type=date]::-webkit-date-and-time-value, input[type=time]::-webkit-date-and-time-value { text-align: left; min-width: 0; }
.dow { font-weight: 700; color: var(--ink-soft); }
.dow.weekend { color: var(--weekend); }

.types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.type {
  font: inherit; font-weight: 600; font-size: 15px; min-height: 52px; border-radius: 12px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink);
  display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 12px; text-align: left;
}
.type.wide { grid-column: 1 / -1; }
.type .tick { font-size: 13px; color: var(--accent); font-weight: 700; }
.type[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.type[aria-pressed="true"] .tick { color: var(--accent-ink); }
.type[data-t="charged_full"] { border-color: #2e9e5b; color: #ffffff; }
.type[data-t="charged_full"] .tick { color: #ffffff; }
.type[data-t="charged_full"][aria-pressed="true"] { background: #2e9e5b; border-color: #2e9e5b; color: #ffffff; }
.type[data-t="charged_full"][aria-pressed="true"] .tick { color: #ffffff; }

.lcd { background: var(--lcd-bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.lcd span.cap { font-size: 12px; color: var(--lcd-fg); opacity: 0.75; letter-spacing: 0.06em; text-transform: uppercase; }
.lcd .line { display: flex; align-items: baseline; gap: 6px; }
.lcd input {
  background: transparent; border: none; color: var(--lcd-fg); font-family: var(--font-num); font-size: 38px; font-weight: 500;
  padding: 0; min-height: 48px; width: 100%; font-variant-numeric: tabular-nums; border-radius: 4px;
}
.lcd .pct { font-family: var(--font-num); font-size: 30px; color: var(--lcd-fg); opacity: 0.6; }
.lcd input::placeholder { color: var(--lcd-fg); opacity: 0.3; }
.lcd input:focus { outline: none; }
.lcd:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }

.save {
  font: inherit; font-size: 17px; font-weight: 700; min-height: 54px; border: none; border-radius: 12px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
}
.save:active { transform: translateY(1px); }
.msg { min-height: 18px; margin: 0; font-size: 14px; color: var(--accent); }
.msg.err { color: var(--warn); }

/* log */
.day { display: flex; flex-direction: column; gap: 6px; }
.day h3 { margin: 0; font-size: 15px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.day h3 .dn { font-weight: 700; }
.day h3 small { font-weight: 500; color: var(--ink-soft); font-size: 13px; text-align: right; }
.day.weekend h3 .dn, .day.weekend .ev .t, .day.weekend .ev .k { color: var(--weekend); }
.day.weekend .ev { border-top-color: var(--weekend); }
.ev { display: grid; grid-template-columns: 52px 1fr auto auto; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.ev .t { font-family: var(--font-num); font-size: 14px; color: var(--ink-soft); }
.ev .n { font-weight: 500; min-width: 0; }
.ev .k { font-family: var(--font-num); font-size: 16px; font-variant-numeric: tabular-nums; text-align: right; }
.del { font: inherit; font-size: 13px; font-weight: 600; min-width: 44px; min-height: 44px; background: none; border: none; color: var(--ink-soft); cursor: pointer; border-radius: 8px; }
.del.confirm { color: var(--warn); }
.ev .n small { display: block; color: var(--ink-soft); font-weight: 400; font-size: 13px; overflow-wrap: anywhere; }
.empty { text-align: center; color: var(--ink-soft); padding: 12px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.bk { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.alt { font: inherit; font-weight: 600; font-size: 15px; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; }
</style>

<main>
  <header>
    <h1>Geely E2 Log</h1>
    <div class="status" id="status">Loading…</div>
  </header>

  <form class="card" id="form" autocomplete="off">
    <h2>New entry</h2>
    <div class="row2">
      <label class="f" for="date"><span class="lbl">Date <span id="dow" class="dow"></span></span><input id="date" type="date" required></label>
      <label class="f" for="time"><span class="lbl">Time</span><input id="time" type="time" required></label>
    </div>
    <div class="types" id="types" role="group" aria-label="Where are you"></div>
    <label class="f" id="noteWrap" for="note" hidden><span class="lbl">Note (optional)</span><input id="note" type="text" maxlength="80" placeholder="e.g. Shops, extra charge"></label>
    <label class="lcd" for="soc">
      <span class="cap">Battery (SOC)</span>
      <span class="line"><input id="soc" type="text" inputmode="decimal" placeholder="000"><span class="pct">%</span></span>
    </label>
    <label class="f" for="odo"><span class="lbl">Odometer (km, optional)</span><input id="odo" type="text" inputmode="numeric" placeholder="e.g. 12 345"></label>
    <button class="save" type="submit">Save entry</button>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <section class="card" aria-labelledby="sumH">
    <h2 id="sumH">Battery cycles used</h2>
    <div id="summary"></div>
  </section>

  <div id="gapWarn" hidden></div>

  <section class="card" aria-labelledby="logH">
    <h2 id="logH">Log</h2>
    <div id="log"></div>
  </section>

  <section class="card" aria-labelledby="bkH">
    <h2 id="bkH">Backup</h2>
    <p class="hint">Your entries are stored on this phone only. Export a copy now and then, or to move to a new phone.</p>
    <div class="bk">
      <button type="button" class="alt" id="exportBtn">Export</button>
      <button type="button" class="alt" id="importBtn">Import</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <p class="msg" id="bkMsg" role="status"></p>
  </section>
</main>

<script>
(function () {
  var TYPES = [
    { id: "leave_home", label: "Leave Home" },
    { id: "arrive_work", label: "Arrive Work" },
    { id: "leave_work", label: "Leave Work" },
    { id: "arrive_home", label: "Arrive Home" },
    { id: "misc", label: "Miscellaneous" },
    { id: "charged_full", label: "Charged to Full" }
  ];
  var NAMES = {}; TYPES.forEach(function (t) { NAMES[t.id] = t.label; });
  var LS_ENTRIES = "e2log.entries.v1";
  var GAP_WARN = 72 * 3600000; // warn when two entries are more than 3 days apart
  var MAX_GAP = 4 * 86400000; // ignore the change across a gap of more than 4 days (missing data)

  var entries = [], store = null, selected = null, confirmId = null;

  var $ = function (id) { return document.getElementById(id); };
  function num(v) { return parseFloat(String(v).replace(",", ".")); }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function nowStr() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function ts(e) { return new Date(e.date + "T" + e.time + ":00").getTime(); }
  function fmt(n, d) { return n.toLocaleString("en-ZA", { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/ /g, " "); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  /* The date and time fields follow the clock until you edit them yourself. */
  var touched = { date: false, time: false };
  function stamp() {
    if (!touched.date) $("date").value = todayStr();
    if (!touched.time) $("time").value = nowStr();
  }
  function refresh() { var d = $("date").value; stamp(); if ($("date").value !== d) renderTypes(); }
  function sorted() { return entries.slice().sort(function (a, b) { return ts(a) - ts(b); }); }

  /* Each change between two readings in time order: a fall is battery used, a rise is charging. */
  function analyse() {
    var all = sorted(), used = 0, charged = 0, perDay = {}, drops = [], gaps = [];
    for (var i = 1; i < all.length; i++) {
      var a = all[i - 1], b = all[i];
      /* Arrive Home followed by Leave Home means the car was parked, so nothing can be missing. */
      if (ts(b) - ts(a) > GAP_WARN && !(a.type === "arrive_home" && b.type === "leave_home")) gaps.push({ from: a, to: b, skipped: ts(b) - ts(a) > MAX_GAP });
      if (ts(b) - ts(a) > MAX_GAP) continue;
      var d = b.soc - a.soc, day = perDay[b.date] = perDay[b.date] || { used: 0, charged: 0 };
      if (d < 0) { used -= d; day.used -= d; drops.push({ t: ts(b), v: -d }); } else if (d > 0) { charged += d; day.charged += d; }
    }
    return { all: all, used: used, charged: charged, perDay: perDay, drops: drops, gaps: gaps };
  }

  function odoStats(r) {
    var o = r.all.filter(function (e) { return e.odo > 0; });
    if (o.length < 2) return "";
    var f = o[0], l = o[o.length - 1], km = l.odo - f.odo;
    if (!(km > 0)) return "";
    var u = r.drops.filter(function (x) { return x.t > ts(f) && x.t <= ts(l); }).reduce(function (a, x) { return a + x.v; }, 0);
    var d = (ts(l) - ts(f)) / 86400000;
    var h = '<div class="stats">' +
      '<div class="stat"><span class="v">' + fmt(km, 0) + '</span><span class="l">km driven</span></div>' +
      '<div class="stat"><span class="v">' + (d >= 0.5 ? fmt(km / d, 0) : "–") + '</span><span class="l">km per day</span></div>';
    if (u > 0) h += '<div class="stat"><span class="v">' + fmt(km / u * 100, 0) + '</span><span class="l">km per full battery</span></div>' +
      '<div class="stat"><span class="v">' + fmt(u / km * 100, 1) + '%</span><span class="l">battery per 100 km</span></div>';
    return h + '</div>';
  }

  function gapWarning(r) {
    if (!r.gaps.length) return "";
    var h = '<div class="warn" role="alert"><strong>Possible missing entries</strong>' +
      '<span>More than 3 days passed between these readings, so some battery use may not be counted:</span><ul>';
    r.gaps.slice(-5).reverse().forEach(function (g) {
      var hrs = (ts(g.to) - ts(g.from)) / 3600000, len = hrs >= 48 ? fmt(hrs / 24, 1) + " days" : fmt(hrs, 0) + " hours";
      h += '<li>' + g.from.date + ' ' + g.from.time + ' to ' + g.to.date + ' ' + g.to.time + ' (' + len + (g.skipped ? ', not counted' : '') + ')</li>';
    });
    h += '</ul>' + (r.gaps.length > 5 ? '<span>Showing the latest 5 of ' + r.gaps.length + '.</span>' : '') +
      '<span>Gaps over 4 days are left out of the total.</span></div>';
    return h;
  }

  function renderSummary() {
    var r = analyse(), box = $("summary");
    if (r.all.length < 2 || ts(r.all[r.all.length - 1]) - ts(r.all[0]) < 3600000) {
      box.innerHTML = '<p class="hint">Log your battery percentage at each stop. After a few entries this shows how many full 100% cycles you have used.</p>';
      return;
    }
    var first = r.all[0], last = r.all[r.all.length - 1];
    var days = (ts(last) - ts(first)) / 86400000;
    var perDay = r.used / days;
    var cycles = r.used / 100;
    /* Completed cycles = whole multiples of 100% used. The bar runs 0 to 100% for the current cycle, then drops back to 0. */
    var whole = Math.floor(r.used / 100 + 0.00001);
    var into = r.used - whole * 100;
    if (into < 0) into = 0;
    var width = into;
    var left = fmt(100 - into, 0) + "% to go";
    var cap = "Cycle " + (whole + 1) + ": " + fmt(into, 0) + "% used";
    box.innerHTML =
      '<div class="hero"><span class="big">' + fmt(into, 0) + '%</span><span class="cap">of cycle ' + (whole + 1) + ' used</span></div>' +
      '<div><div class="bar" role="img" aria-label="' + cap + '"><i style="width:' + width.toFixed(1) + '%"></i></div></div>' +
      '<div class="barlabel"><span>' + cap + '</span><span>' + left + '</span></div>' +
      '<div class="stats">' +
      '<div class="stat"><span class="v">' + fmt(cycles, 2) + '</span><span class="l">total used (cycles)</span></div>' +
      '<div class="stat"><span class="v">' + whole + '</span><span class="l">completed cycles</span></div>' +
      '<div class="stat"><span class="v">' + fmt(perDay, 1) + '%</span><span class="l">used per day</span></div>' +
      '<div class="stat"><span class="v">' + (perDay > 0 ? fmt(100 / perDay, 1) : "–") + '</span><span class="l">days per cycle</span></div>' +
      '<div class="stat"><span class="v">' + fmt(r.charged, 0) + '%</span><span class="l">total charged</span></div>' +
      '<div class="stat"><span class="v">' + entries.filter(function (e) { return e.type === "charged_full"; }).length + '</span><span class="l">full charges logged</span></div>' +
      '</div>' + odoStats(r) + '<p class="hint">From ' + first.date + ' to ' + last.date + ' (' + fmt(days, 1) + ' days).</p>';
  }

  function renderDow() {
    var v = $("date").value, el = $("dow");
    if (!v) { el.textContent = ""; return; }
    var dt = new Date(v + "T12:00:00");
    el.textContent = dt.toLocaleDateString("en-ZA", { weekday: "long" });
    el.className = "dow" + (dt.getDay() === 0 || dt.getDay() === 6 ? " weekend" : "");
  }

  function renderTypes() {
    renderDow();
    var d = $("date").value, done = {};
    entries.forEach(function (e) { if (e.date === d) done[e.type] = true; });
    var html = "";
    TYPES.forEach(function (t) {
      html += '<button type="button" class="type' + "" + '" data-t="' + t.id + '" aria-pressed="' + (selected === t.id) + '"><span>' + t.label + '</span>' +
        (done[t.id] ? '<span class="tick" aria-label="already logged">✓</span>' : "") + "</button>";
    });
    $("types").innerHTML = html;
    $("noteWrap").hidden = selected !== "misc" && selected !== "charged_full";
    $("note").placeholder = selected === "charged_full" ? "Where? e.g. Home, Office, Mall" : "e.g. Shops, extra charge";
    var lo = 0; sorted().forEach(function (e) { if (e.odo > 0) lo = e.odo; });
    $("odo").placeholder = lo ? "last: " + fmt(lo, 0) : "e.g. 12 345";
  }

  function renderLog() {
    var log = $("log");
    if (!entries.length) { log.innerHTML = '<p class="empty">Nothing logged yet. Pick where you are, type the battery percentage and save.</p>'; return; }
    var r = analyse(), byDay = {};
    entries.forEach(function (e) { (byDay[e.date] = byDay[e.date] || []).push(e); });
    var html = "";
    Object.keys(byDay).sort().reverse().forEach(function (d) {
      var list = byDay[d].sort(function (a, b) { return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
      var dt = new Date(d + "T12:00:00");
      var wk = dt.getDay() === 0 || dt.getDay() === 6;
      var wd = dt.toLocaleDateString("en-ZA", { weekday: "long" });
      var dm = dt.toLocaleDateString("en-ZA", { day: "numeric", month: "short" });
      var pd = r.perDay[d], sub = "";
      if (pd && pd.used > 0) sub = "used " + fmt(pd.used, 0) + "%";
      if (pd && pd.charged > 0) sub += (sub ? " · " : "") + "charged " + fmt(pd.charged, 0) + "%";
      html += '<div class="day' + (wk ? " weekend" : "") + '"><h3><span><span class="dn">' + wd + '</span> ' + dm + '</span><small>' + sub + '</small></h3>';
      list.forEach(function (e) {
        html += '<div class="ev"><span class="t">' + e.time + '</span><span class="n">' + NAMES[e.type] + (e.note ? '<small>' + esc(e.note) + '</small>' : '') + (e.odo > 0 ? '<small>' + fmt(e.odo, 0) + ' km</small>' : '') + '</span><span class="k">' + fmt(e.soc, 0) + '%</span>' +
          '<button type="button" class="del' + (confirmId === e.id ? " confirm" : "") + '" data-del="' + e.id + '" aria-label="Delete entry">' +
          (confirmId === e.id ? "Delete?" : "✕") + "</button></div>";
      });
      html += "</div>";
    });
    log.innerHTML = html;
  }

  function renderGapWarn() {
    var h = gapWarning(analyse()), el = $("gapWarn");
    el.innerHTML = h; el.hidden = !h;
  }

  function renderAll() { renderSummary(); renderGapWarn(); renderTypes(); renderLog(); }

  function localStore() {
    try { entries = JSON.parse(lsGet(LS_ENTRIES) || "[]"); } catch (e) { entries = []; }
    function save() { lsSet(LS_ENTRIES, JSON.stringify(entries)); }
    return {
      add: function (e) { e.id = "l" + Date.now(); entries.push(e); save(); renderAll(); return Promise.resolve(); },
      remove: function (id) { entries = entries.filter(function (x) { return x.id !== id; }); save(); renderAll(); return Promise.resolve(); }
    };
  }

  async function init() {
    $("date").value = todayStr(); $("time").value = nowStr();
    renderAll();
    store = localStore();
    $("status").textContent = "Saved on this phone";
    renderAll();
  }

  function say(text, err) { var m = $("msg"); m.textContent = text; m.className = "msg" + (err ? " err" : ""); }

  $("types").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-t]"); if (!b) return;
    selected = b.getAttribute("data-t"); stamp(); say(""); renderTypes();
    if (selected === "charged_full" && !$("soc").value) $("soc").value = "100";
    $("soc").focus();
  });
  $("date").addEventListener("change", renderTypes);

  $("form").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    if (!selected) { say("Pick where you are first.", true); return; }
    var s = num($("soc").value);
    if (!(s >= 0 && s <= 100)) { say("Type a battery percentage from 0 to 100.", true); return; }
    if (!store) { say("Still loading, try again in a moment.", true); return; }
    stamp();
    var e = { date: $("date").value, time: $("time").value, type: selected, soc: s };
    if (selected === "misc" || selected === "charged_full") e.note = $("note").value.trim();
    var ov = $("odo").value.trim();
    if (ov) {
      var od = parseFloat(ov.replace(/[\s,]/g, ""));
      if (!(od > 0)) { say("Type the odometer as a number of km, or leave it empty.", true); return; }
      e.odo = od;
    }
    try {
      await store.add(e);
      say(NAMES[selected] + " saved: " + fmt(s, 0) + "%");
      $("soc").value = ""; $("note").value = ""; $("odo").value = ""; selected = null; touched.date = touched.time = false; stamp();
      renderTypes();
    } catch (err) { say("Could not save. Check your connection and try again.", true); }
  });

  $("log").addEventListener("click", async function (ev) {
    var b = ev.target.closest("button[data-del]"); if (!b) return;
    var id = b.getAttribute("data-del");
    if (confirmId !== id) { confirmId = id; renderLog(); return; }
    confirmId = null;
    try { await store.remove(id); } catch (err) { say("Could not delete. Try again.", true); }
    renderLog();
  });

  $("date").addEventListener("input", function () { touched.date = true; });
  $("time").addEventListener("input", function () { touched.time = true; });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  window.addEventListener("pageshow", refresh);
  window.addEventListener("focus", refresh);
  setInterval(function () { if (document.activeElement !== $("time") && document.activeElement !== $("date")) refresh(); }, 20000);

  /* ---------- backup ---------- */
  var APP_NAME = "geely";
  function bkSay(t, err) { var m = $("bkMsg"); m.textContent = t; m.className = "msg" + (err ? " err" : ""); }
  function entryKey(e) { return [e.date, e.time, e.type, e.kwh != null ? e.kwh : e.soc].join("|"); }
  $("exportBtn").addEventListener("click", async function () {
    var list = entries.map(function (e) { var c = {}; Object.keys(e).forEach(function (k) { if (k !== "id") c[k] = e[k]; }); return c; });
    var payload = JSON.stringify({ app: APP_NAME, version: 1, exported: new Date().toISOString(), entries: list }, null, 1);
    var name = APP_NAME + "-backup-" + todayStr() + ".json";
    try {
      var file = new File([payload], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); bkSay("Backup shared: " + list.length + " entries."); return; }
    } catch (err) { if (err && err.name === "AbortError") return; }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    bkSay("Backup saved: " + name + " (" + list.length + " entries).");
  });
  $("importBtn").addEventListener("click", function () { $("importFile").click(); });
  $("importFile").addEventListener("change", function () {
    var f = this.files && this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result), list = Array.isArray(d) ? d : d.entries;
        if (!Array.isArray(list)) throw new Error("no entries");
        var seen = {}; entries.forEach(function (e) { seen[entryKey(e)] = 1; });
        var added = 0, stamp0 = Date.now();
        list.forEach(function (x) {
          if (!x || !/^\d{4}-\d{2}-\d{2}$/.test(x.date) || !/^\d{2}:\d{2}$/.test(x.time) || !NAMES[x.type]) return;
          var e = {}; Object.keys(x).forEach(function (k) { if (k !== "id" && k !== "created") e[k] = x[k]; });
          if (e.kwh != null) e.kwh = Number(e.kwh); if (e.soc != null) e.soc = Number(e.soc);
          if (!(e.kwh > 0 || e.soc >= 0)) return;
          if (seen[entryKey(e)]) return; seen[entryKey(e)] = 1;
          e.id = "i" + stamp0 + "_" + added; entries.push(e); added++;
        });
        lsSet(LS_ENTRIES, JSON.stringify(entries)); renderAll();
        bkSay(added + " entries added" + (list.length - added ? ", " + (list.length - added) + " skipped (already here or not valid)." : "."));
      } catch (err) { bkSay("That file is not a backup from this app.", true); }
      $("importFile").value = "";
    };
    r.readAsText(f);
  });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});

  init();
})();
</script>


</body></html>
